name: Morrowind-iOS
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ARCHS: arm64
    CLANG_ENABLE_OBJC_ARC: YES
targets:
  Morrowind:
    type: application
    platform: iOS
    sources:
      - Morrowind
    settings:
      base:
        PRODUCT_NAME: Morrowind
        PRODUCT_BUNDLE_IDENTIFIER: org.openmw.openmw
        INFOPLIST_FILE: Morrowind/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # overridden by ios/build.sh
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "0"
    scheme: {}
