name: Morrowind-iOS
options:
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ARCHS: arm64
    CLANG_ENABLE_OBJC_ARC: YES
targets:
  Morrowind:
    type: application
    platform: iOS
    sources:
      - path: Morrowind
        excludes: ["settings.cfg"]  # staged into Morrowind.app/engine by the resources script
    dependencies:
      - framework: ../ios-deps/artifacts/SDL2.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/SDL2main.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/Mesa.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/MoltenVK.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/OpenSceneGraph.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/libpng.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/libjpeg.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/freetype.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/LZ4.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/Boost.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/yaml-cpp.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/Bullet.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/MyGUI.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/RecastNavigation.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/ICU.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/LuaJIT.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/FFmpeg.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/OpenAL.xcframework
        embed: false
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CoreAudio.framework
      - sdk: CoreBluetooth.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreHaptics.framework
        weak: true
      - sdk: CoreMotion.framework
      - sdk: CoreText.framework
      - sdk: CoreVideo.framework
      - sdk: Foundation.framework
      - sdk: GameController.framework
        weak: true
      - sdk: IOSurface.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: UIKit.framework
      - sdk: libc++.tbd
      - sdk: libsqlite3.tbd
      - sdk: libz.tbd
    postBuildScripts:
      # OpenMW's local config, settings defaults and resources, staged by its CMake build, and the iOS settings
      # defaults (loaded as additional defaults from the local config dir) -> Morrowind.app/engine
      - name: OpenMW resources
        basedOnDependencyAnalysis: false
        # declared so code signing re-runs after it (a changed resource would break the seal otherwise)
        outputFiles: ["$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/engine"]
        script: |
          set -e
          dest="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/engine"
          mkdir -p "$dest"
          rsync -a --delete "$OPENMW_BUILD_DIR/resources" "$OPENMW_BUILD_DIR/openmw.cfg" \
              "$OPENMW_BUILD_DIR/defaults.bin" "$OPENMW_BUILD_DIR/gamecontrollerdb.txt" "$SRCROOT/Morrowind/settings.cfg" \
              "$dest/"
    settings:
      base:
        PRODUCT_NAME: Morrowind
        PRODUCT_BUNDLE_IDENTIFIER: org.openmw.openmw
        INFOPLIST_FILE: Morrowind/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # increased memory limit (automatic signing adds the capability to the App ID)
        CODE_SIGN_ENTITLEMENTS: Morrowind/Morrowind.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # OpenMW's static libraries (CMake build by ios/build.sh), SDL_main in libopenmw.a
        LIBRARY_SEARCH_PATHS: ["$(inherited)", "$(OPENMW_BUILD_DIR)/lib"]
        # as OpenMW links on Apple (OSG plugins register themselves in static initializers). Release dead-strips
        # unreferenced objects and ignores their unresolved/duplicate symbols (FIXES #18)
        OTHER_LDFLAGS: ["$(inherited)", "-all_load", "-lopenmw", "-lopenmw-lib", "-lcomponents",
                        "-losg-ffmpeg-videoplayer", "-loics", "-llocal_tinyxml", "-lsmhasher", "$(METALFX_LDFLAGS)"]
        # MetalFX upscaling (apps/openmw/ios/metalfx.mm); the simulator SDK has no MetalFX
        "METALFX_LDFLAGS[sdk=iphoneos*]": ["-framework", "MetalFX"]
        # overridden by ios/build.sh
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "0"
        OPENMW_BUILD_DIR: ""
      configs:
        Debug:
          OTHER_CFLAGS: ["$(inherited)", "-fno-standalone-debug"]
        # strips the app binary in plain builds too (Xcode strips only when installing); the dSYM keeps the symbols
        Release:
          DEPLOYMENT_POSTPROCESSING: YES
    scheme: {}
