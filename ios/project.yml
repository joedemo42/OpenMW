name: Morrowind-iOS
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ARCHS: arm64
    CLANG_ENABLE_OBJC_ARC: YES
targets:
  Morrowind:
    type: application
    platform: iOS
    sources:
      - Morrowind
    dependencies:
      - framework: ../ios-deps/artifacts/SDL2.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/SDL2main.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/Mesa.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/MoltenVK.xcframework
        embed: false
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CoreAudio.framework
      - sdk: CoreBluetooth.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreHaptics.framework
        weak: true
      - sdk: CoreMotion.framework
      - sdk: CoreVideo.framework
      - sdk: Foundation.framework
      - sdk: GameController.framework
        weak: true
      - sdk: IOSurface.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: UIKit.framework
      - sdk: libc++.tbd
      - sdk: libz.tbd
    settings:
      base:
        PRODUCT_NAME: Morrowind
        PRODUCT_BUNDLE_IDENTIFIER: org.openmw.openmw
        INFOPLIST_FILE: Morrowind/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # overridden by ios/build.sh
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "0"
    scheme: {}
