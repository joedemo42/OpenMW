name: Morrowind-iOS
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ARCHS: arm64
    CLANG_ENABLE_OBJC_ARC: YES
targets:
  Morrowind:
    type: application
    platform: iOS
    sources:
      - Morrowind
      # OSG bring-up test: OpenMW's SDL graphics window, OpenMW's monospace font (FreeType check)
      - path: ../components/sdlutil/sdlgraphicswindow.cpp
      - path: ../files/data/fonts/DejaVuLGCSansMono.ttf
        buildPhase: resources
    dependencies:
      - framework: ../ios-deps/artifacts/SDL2.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/SDL2main.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/Mesa.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/MoltenVK.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/OpenSceneGraph.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/libpng.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/libjpeg.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/freetype.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/LZ4.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/Boost.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/yaml-cpp.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/Bullet.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/MyGUI.xcframework
        embed: false
      - framework: ../ios-deps/artifacts/RecastNavigation.xcframework
        embed: false
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: CoreAudio.framework
      - sdk: CoreBluetooth.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreHaptics.framework
        weak: true
      - sdk: CoreMotion.framework
      - sdk: CoreVideo.framework
      - sdk: Foundation.framework
      - sdk: GameController.framework
        weak: true
      - sdk: IOSurface.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: UIKit.framework
      - sdk: libc++.tbd
      - sdk: libz.tbd
    settings:
      base:
        PRODUCT_NAME: Morrowind
        PRODUCT_BUNDLE_IDENTIFIER: org.openmw.openmw
        INFOPLIST_FILE: Morrowind/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        # OpenMW includes SDL headers without the SDL2/ prefix and its own headers from the repository root
        HEADER_SEARCH_PATHS: ["$(BUILT_PRODUCTS_DIR)/include/SDL2", "$(SRCROOT)/.."]
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "OSG_LIBRARY_STATIC"]
        # as OpenMW links on Apple (OSG plugins register themselves in static initializers); every object of
        # every archive gets linked, so the link also checks the dependencies for unresolved/duplicate symbols
        OTHER_LDFLAGS: ["$(inherited)", "-all_load"]
        # overridden by ios/build.sh
        MARKETING_VERSION: "0.0.0"
        CURRENT_PROJECT_VERSION: "0"
    scheme: {}
